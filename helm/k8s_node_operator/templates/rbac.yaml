apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8s-node-operator.clusterrole.fullname" . }}
rules:
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k8s-node-operator.clusterrole.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "k8s-node-operator.serviceaccount.fullname" . }}
    namespace: {{ .Release.Name }}
roleRef:
  kind: ClusterRole
  name: {{ include "k8s-node-operator.clusterrole.fullname" . }}
  apiGroup: rbac.authorization.k8s.io