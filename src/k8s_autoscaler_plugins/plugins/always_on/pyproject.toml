[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "k8s-autoscaler-plugins-always-on"
version = "0.1.0"
dependencies=[
    "k8s_autoscaler_plugins",
    "pluggy",
    ]

[project.entry-points.k8s-autoscaler-plugins]
always_on = "k8s_autoscaler_plugins.plugins.always_on.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/plugins/always_on"]