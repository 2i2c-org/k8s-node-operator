################################################################################
# Build Configuration
################################################################################

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

################################################################################
# Project Configuration
################################################################################

[project]
name = "k8s-autoscaler-plugins"

dynamic = ["version"]

description = """
    Scale nodes for your k8s cluster ahead of time with plugins.

    This custom k8s operator provides a way to bring nodes online in advance of user demand. We create a framework composed of two parts:

    - The mechanism by which minimum nodepool sizes are scaled up or down
    - A plug-in system that initiates node scaling based on different types of triggers, e.g. event-based triggers such as crossing a utilisation threshold, or time-based triggers such as a calendar integration.
"""
authors = [
    { name = "jnywong", email = "jnywong.pro@gmail.com" },
]
license = "BSD-3-Clause"
readme = {"file" = "README.md", "content-type" = "text/markdown"}
# Please consult https://pypi.org/classifiers/ for a full list.
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

keywords = ["aws", "gcp", "kubernetes", "python"]

# Package dependencies
dependencies = [
    "always_on>=0.1",
    "asyncio>=4.0",
    "kopf>=1.44",
    "kubernetes>=36.0",
    "google-cloud-container>=2.65",
    "pluggy>=1.7",
]

[project.urls]
"Homepage" = "https://github.com/2i2c-org/k8s-autoscaler-plugins"
"Source Code" = "https://github.com/2i2c-org/k8s-autoscaler-plugins"
"Bug Tracker" = "https://github.com/2i2c-org/k8s-autoscaler-plugins/issues"
"Documentation" = "https://k8s-autoscaler-plugins.readthedocs.io/en/latest/"

[project.scripts]
# script = "<package>.__main__:<entrypoint>"

[project.optional-dependencies]
dev = [
    "chartpress",    
    "hatch",
    "ipython",
    "pre-commit",
]

################################################################################
# Tool Configuration
################################################################################

# Exclude files outside package
[tool.hatch.build]
only-packages = true

[tool.hatch.build.targets.wheel]
packages = ["src/k8s_autoscaler_plugins"]

[tool.hatch.build.hooks.vcs]
version-file = "src/k8s_autoscaler_plugins/_version.py"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"

[tool.hatch.envs.default.sources]
always_on = "./src/k8s_autoscaler_plugins/plugins/always_on"

# The default isort output conflicts with black autoformatting.
# Tell isort to behave nicely with black
# See https://pycqa.github.io/isort/docs/configuration/black_compatibility.html
# for more information.
[tool.isort]
profile = "black"

[tool.pydoclint]
style = "google"  # TODO: Other styles are possible here, like 'numpy'
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
exclude = "_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["raises"]
env = [
    "K8S_AUTOSCALER_PLUGINS_CLOUD_PROVIDER=TEST",
    "K8S_AUTOSCALER_PLUGINS_RETRY_LIMIT=2",
]

[tool.coverage.paths]
source = [
    "src/k8s_autoscaler_plugins",
]

[tool.coverage.run]
branch = true
parallel = true
omit = [
    "src/k8s_autoscaler_plugins/_version.py",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover"]
precision = 2

################################################################################
# Hatch Environments
################################################################################

[tool.hatch.envs.default]
python="3.14"
installer="pip"
post-install-commands = [
  "python -m pip install --upgrade pip"
]

[tool.hatch.envs.dev]
description = """
Environment for local development.
"""
features = ["dev"]
path = ".venv"

[tool.hatch.envs.release]
inherits = ["default"]
description = """
Environment for making releases.
"""
dependencies = [
    "github-activity~=1.1",
    "tbump~=6.11",
]

[tool.hatch.envs.install]
description = """Test the installation of the package."""
dependencies = [
    "pip",
    "twine",
]
detached = true
builder = true

[tool.hatch.envs.install.scripts]
check = [
    "pip check",
    "hatch build {args:--clean}",
    "twine check dist/*",
]

[tool.hatch.envs.test]
description = """
Run test suite
"""
dependencies = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-env",
    "pytest-mock",
    "pytest-raises",
    "pytest-randomly",
    "pytest-xdist",
]

[[tool.hatch.envs.test.matrix]]
python = ["3.12", "3.13", "3.14"]

[tool.hatch.envs.test.scripts]
run = "pytest {args:--cov=src/k8s_autoscaler_plugins --cov-report=term-missing --cov-report=xml}"

[tool.hatch.envs.style]
description = """Check the style of the codebase."""
dependencies = [
    "pydoclint",
]
detached = true

[tool.hatch.envs.style.scripts]
docstrings = "pydoclint"
check = ["docstrings"]

[tool.hatch.envs.audit]
description = """Check dependencies for security vulnerabilities."""
extra-dependencies = [
    "pip-audit",
]

[tool.hatch.envs.audit.scripts]
check = ["pip-audit"]

[tool.hatch.envs.types]
description = """Check the static types of the codebase."""
dependencies = [
    "mypy",
    "types-PyYAML"
]

[tool.hatch.envs.types.scripts]
check = "mypy --ignore-missing-imports src/k8s_autoscaler_plugins"

[tool.hatch.envs.docs]
description = """Build or serve the documentation."""
python = "3.14"
dependencies = [
    "mystmd",
]

[tool.hatch.envs.docs.scripts]
build = ["env -C docs -- myst build --html"]
serve = ["env -C docs -- myst start"]
